[project]
name = "gustarr"
version = "0.6.1"
description = "Media taste learning and Servarr automation: per-person profiles learn what you like from Jellyfin/Last.fm/ListenBrainz history and drive Sonarr/Radarr/Lidarr."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# GPU embedding + training. Kept optional so the CLI/actuator side stays
# lightweight — collectors and the web UI never need torch.
ml = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.21",
]

[project.scripts]
gustarr = "gustarr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gustarr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned to ruff's classic defaults: 0.16 broadened the default rule set
# (DTZ, TRY, ...) and a linter bump must not silently move the CI gate.
# Adopting more rules is a deliberate decision, not a dependency side effect.
select = ["E4", "E7", "E9", "F"]

# Keep the qualified certificate-build input byte-stable. Its existing
# compact formatting and unused import are the only exceptions.
[tool.ruff.lint.per-file-ignores]
"nix/prune-ca-bundles.py" = ["E401", "E701", "E702", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
